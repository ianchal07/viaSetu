<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VíaSetu </title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <section id="loginPanel" class="panel login-panel">
      <h1>VíaSetu</h1>
      <p class="subtle">Secure network.</p>
      <form id="loginForm" method="post" autocomplete="off">
        <label for="password">Password / PIN</label>
        <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
        <button type="submit">Sign in</button>
      </form>
      <p id="loginError" class="error" role="alert"></p>
    </section>

    <section id="appPanel" class="panel hidden">
      <div id="topProgress" class="top-progress" aria-hidden="true">
        <div id="topProgressBar" class="top-progress-bar"></div>
      </div>
      <header class="toolbar">
        <div>
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="subtle" id="sessionInfo"></div>
        </div>
        <div class="toolbar-actions">
          <label class="btn secondary">
            Upload
            <input id="fileInput" type="file" multiple hidden>
          </label>
          <button id="toggleRecursive" class="secondary">Recursive: Off</button>
          <button id="privacySettingsBtn" class="secondary" title="Privacy Settings">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M8 1L3 3V7C3 10.5 5.5 13.5 8 15C10.5 13.5 13 10.5 13 7V3L8 1Z"/>
            </svg>
          </button>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
      </header>

      <section class="status-row">
        <span id="loadingState" class="subtle" aria-live="polite"></span>
        <span id="message" class="message" role="status" aria-live="polite"></span>
      </section>

      <section id="uploadList" class="upload-list"></section>

      <div class="scroll-hint mobile-only">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 12L10 8L6 4"/>
        </svg>
        <span>Scroll to see all columns</span>
      </div>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Size</th>
              <th>Modified</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="fileRows"></tbody>
        </table>
      </section>

      <footer class="pager">
        <button id="prevPage">Prev</button>
        <span id="pageMeta"></span>
        <button id="nextPage">Next</button>
      </footer>
    </section>

    <!-- Privacy Settings Modal -->
    <div id="privacyModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Privacy & Security Settings</h2>
          <button id="closeModalBtn" class="icon-btn" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 5L15 15M15 5L5 15"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="modal-description">Configure automatic cleanup when you exit VíaSetu. This helps protect your privacy by removing traces of your session.</p>
          
          <div class="settings-group">
            <h3>Clear on Logout</h3>
            <label class="setting-item">
              <input type="checkbox" id="clearOnLogout" checked>
              <span>Clear all data when clicking Logout button</span>
            </label>
          </div>

          <div class="settings-group">
            <h3>Clear on Tab/Browser Close</h3>
            <label class="setting-item">
              <input type="checkbox" id="clearOnTabClose" checked>
              <span>Clear all data when closing tab or browser</span>
            </label>
          </div>

          <div class="settings-group">
            <h3>What to Clear</h3>
            <label class="setting-item">
              <input type="checkbox" id="clearLocalStorage" checked>
              <span>Local Storage</span>
            </label>
            <label class="setting-item">
              <input type="checkbox" id="clearSessionStorage" checked>
              <span>Session Storage</span>
            </label>
            <label class="setting-item">
              <input type="checkbox" id="clearCookies" checked>
              <span>Cookies</span>
            </label>
            <label class="setting-item">
              <input type="checkbox" id="clearCache" checked>
              <span>Cache</span>
            </label>
            <label class="setting-item">
              <input type="checkbox" id="clearHistory" checked>
              <span>Browser History (limited)</span>
            </label>
          </div>

          <div class="settings-actions">
            <button id="saveSettingsBtn">Save Settings</button>
            <button id="clearNowBtn" class="secondary">Clear All Data Now</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
